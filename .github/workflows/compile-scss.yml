name: Auto Compile SCSS

on:
  push:
    paths:
      - 'assets/scss/**'
    branches:
      - main

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dart Sass
        run: npm install -g sass

      - name: Compile SCSS to CSS
        run: sass assets/scss/styles.scss assets/css/styles.css

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/css/styles.css assets/css/styles.css.map
          git diff --staged --quiet || (git commit -m "chore: auto-compile scss [skip ci]" && git push)
