name: Update Wiki Stats

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Stats from Cloudflare Worker
        run: |
          node -e '
          const fs = require("fs");

          async function main() {
            try {
              // Paste your Cloudflare Worker URL below:
              const WORKER_URL = "https://wiki-stats-proxy.dostaly.workers.dev";
              
              console.log("Fetching stats from proxy worker...");
              const res = await fetch(WORKER_URL);
              const data = await res.json();

              console.log("Received data:", JSON.stringify(data));

              fs.mkdirSync("assets/json", { recursive: true });
              fs.writeFileSync("assets/json/stats.json", JSON.stringify(data, null, 4));
            } catch (e) {
              console.error("Fetch failed:", e.message);
              process.exit(1);
            }
          }

          main();
          '

      - name: Commit and push updated stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/json/stats.json
          git commit -m "Update wiki statistics [skip ci]" || exit 0
          git push