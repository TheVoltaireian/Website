name: Update Wiki Stats

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Stats and Update assets/json/stats.json
        run: |
          node -e '
          const fs = require("fs");

          const wikis = [
            { name: "zvh", apiUrl: "https://zombies-vs-humans.wiki/api.php" },
            { name: "flee", apiUrl: "https://10playerflee.wiki/api.php" },
            { name: "forsaken", apiUrl: "https://forsaken.wiki/api.php" }
          ];

