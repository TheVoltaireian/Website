---
layout: base
---

<header class="post-header">
    <a href="{{ '/blog/' | relative_url }}">
        ← Back to blog
    </a>

    <h1>{{ page.title }}</h1>

    <p>
        <time datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date: "%B %-d, %Y" }}
        </time>
    </p>
</header>

<main class="post-main">
    <article class="post-content">
        {{ content }}
    </article>
</main>
