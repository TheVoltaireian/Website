<!doctype html>
<html lang="en" class="{{ page.body_class | default: 'page' }}" data-page="{{ page.page_id | default: 'default' }}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Open Graph -->
        <meta property="og:locale" content="en_US">
        <meta property="og:type" content="website">
        <meta property="og:title" content="wildvoltaireian.xyz">
        <meta property="og:description" content="Say hello to my world. Web developer and wiki enthusiast.">
        <meta property="og:url" content="https://wildvoltaireian.xyz/">
        <meta property="og:site_name" content="Made by Wild">
        <meta property="og:image" content="https://wildvoltaireian.xyz/assets/images/wildvoltaireian.xyz.png">
        <meta property="og:image:secure_url" content="https://wildvoltaireian.xyz/assets/images/wildvoltaireian.xyz.png">
        <meta property="og:image:type" content="image/png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="WildVoltaireian's portfolio and blog">

        <!-- Twitter/X -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="wildvoltaireian.xyz">
        <meta name="twitter:description" content="Say hello to my world. Web developer and wiki enthusiast.">
        <meta name="twitter:image" content="https://wildvoltaireian.xyz/assets/images/wildvoltaireian.xyz.png">
        <meta name="twitter:image:alt" content="WildVoltaireian's portfolio and blog">

        <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

        <meta name="description" content="{{ page.description | default: site.description }}">

        <link rel="icon" href="{{ '/assets/images/svgs/WildVoltaireian - SVG/1-cropped.svg' | relative_url }}" type="image/svg+xml">
        <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    </head>
    <body class="{{ page.body_class }}">
        {{ content }}

        <script defer src="{{ '/assets/js/main.js' | relative_url }}"></script>
    </body>
</html>
