---
layout: base
title: Contact Me
page_id: contact
permalink: /contact/
---
<main class="contact">
    <div class="contact__main">
        <h1 class="contact__mainTitle">Reach Out</h1>
        <div class="contact__mainContent">
            <div class="contact__mainSocials">
                <p>I'm open to any problems or inqiuries. The best way to reach me is through this page.</p>
                <ul class="contact__mainList">
                    <li>
                        <a href="mailto:hello@wildvoltaireian.xyz">
                            <img src="{{ '/assets/images/logos/Socials/MailMe.svg' | relative_url }}" alt="Mail icon">
                            <span>Email me / hello@wildvoltaireian.xyz</span>  
                        </a>
                    </li>
                </ul>
                <ul class="contact__secondaryList">
                    <li>
                        <a href="https://twitter.com/wildvoltaireian">
                            <img src="{{ '/assets/images/logos/Socials/Twitter.svg' | relative_url }}" alt="Twitter/X icon">
                            <span>@wildvoltaireian</span>  
                        </a>
                    </li>
                    <li>
                        <a href="https://github.com/TheVoltaireian/Website">
                            <img src="{{ '/assets/images/logos/Socials/Github.svg' | relative_url }}" alt="GitHub icon">
                            <span>github.com/thevoltaireian</span>  
                        </a>
                    </li>
                </ul>
            </div>
            <form id="contact__mainForm" class="contact__mainForm">
                <!-- Hidden Access Key -->
                <input type="hidden" name="access_key" value="14dddd94-2431-41b5-937f-b9020e1b033d">

                <div class="form__groups">
                    <div class="form__group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>

                    <div class="form__group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="john@company.com" required>
                    </div>
                </div>

                <div class="form__group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Hello, Wild." required></textarea>
                </div>

                <hr>

                <button type="submit" id="submit-btn" class="button button--primary">Send Message</button>
                
                <div id="form__result" style="margin-top: var(--space-md);"></div>
            </form>
        </div>
    </div>
</main>
